name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
{%- if cookiecutter.node_package_manager == "bun" %}
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
{%- elif cookiecutter.node_package_manager == "pnpm" %}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
{%- else %}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
{%- endif %}
      - name: Biome check
        run: npx biome check
      - name: Type check
        run: npx tsc --noEmit
      - name: JSDoc lint
        run: npx eslint --config eslint.jsdoc.cjs src/
      - name: Tests with coverage
        run: npx vitest run --coverage
      - name: Dependency audit
        run: {{ cookiecutter.node_package_manager }} {% if cookiecutter.node_package_manager == "bun" %}pm {% endif %}audit
{%- if cookiecutter.include_playwright == "yes" %}

  e2e:
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - uses: actions/checkout@v4
{%- if cookiecutter.node_package_manager == "bun" %}
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
{%- elif cookiecutter.node_package_manager == "pnpm" %}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
{%- else %}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
{%- endif %}
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Run Playwright tests
        run: npx playwright test
{%- endif %}
